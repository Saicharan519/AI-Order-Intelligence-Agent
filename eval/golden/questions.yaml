- id: ambig_02
  split: dev
  category: ambiguous
  question: How fast is our delivery?
  reference_sql: |
    SELECT round(avg(extract(epoch FROM order_delivered_customer_date - order_purchase_timestamp)
                 / 86400), 2)
    FROM raw.orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
  accepted_alternatives:
    - |
      SELECT round((percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM
               order_delivered_customer_date - order_purchase_timestamp) / 86400))::numeric, 2)
      FROM raw.orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
  allow_extra_columns: true
  expected_route: [clarify, answer]
  notes: Accepted - mean or median days from purchase to delivery, delivered orders.

