- id: trend_03
  split: dev
  category: trend
  question: What was the late-delivery rate for each month from January to August 2018?
  reference_sql: |
    SELECT date_trunc('month', order_purchase_timestamp)::date AS month,
           round(100.0 * count(*) FILTER (
             WHERE order_delivered_customer_date::date > order_estimated_delivery_date::date)
           / count(*), 2)
    FROM raw.orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND order_purchase_timestamp >= '2018-01-01' AND order_purchase_timestamp < '2018-09-01'
    GROUP BY 1 ORDER BY 1
  ordering: ordered
