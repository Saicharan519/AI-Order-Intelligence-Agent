# Golden question set (technical design, section 8.1).
#
# Reference SQL is written on the RAW tables, independently of the analytics views, so a view
# defect shows up as a mismatch. Definitions follow glossary/glossary.md:
#   sale       = order_status NOT IN ('canceled', 'unavailable')
#   delivered  = order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
#   late       = delivered AND delivered DATE > estimated DATE
#   revenue    = sum(item price) over sales, excluding freight
#   customer   = customer_unique_id;  review = latest answered review per order
#   "today"    = 2018-08-31 (so "last month" = July 2018, "last year" = 2017)
#
# Splits: 40 dev (prompt tuning allowed) / 20 test (frozen; fingerprint in test_split.sha256).
# expected_route lists every acceptable route. Out-of-scope items have no SQL.

