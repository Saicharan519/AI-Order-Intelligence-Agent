- id: trend_06
  split: dev
  category: trend
  question: What is the average review score of late deliveries compared with on-time deliveries?
  reference_sql: |
    WITH r AS (
      SELECT DISTINCT ON (order_id) order_id, review_score FROM raw.order_reviews
      ORDER BY order_id, review_answer_timestamp DESC, review_creation_date DESC, review_row_id DESC)
    SELECT o.order_delivered_customer_date::date > o.order_estimated_delivery_date::date AS is_late,
           round(avg(r.review_score), 2)
    FROM raw.orders o JOIN r ON r.order_id = o.order_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1
  accepted_alternatives:
    - |
      WITH r AS (
        SELECT DISTINCT ON (order_id) order_id, review_score FROM raw.order_reviews
        ORDER BY order_id, review_answer_timestamp DESC, review_creation_date DESC, review_row_id DESC)
      SELECT round(avg(r.review_score) FILTER (
               WHERE o.order_delivered_customer_date::date > o.order_estimated_delivery_date::date), 2),
             round(avg(r.review_score) FILTER (
               WHERE o.order_delivered_customer_date::date <= o.order_estimated_delivery_date::date), 2)
      FROM raw.orders o JOIN r ON r.order_id = o.order_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
  allow_extra_columns: true
  expected_route: answer
  tags: [duplicate_reviews]

- id: trend_07
  split: dev
  category: trend
  question: What were the top 10 product categories by revenue in 2018?
  reference_sql: |
    SELECT CASE WHEN p.product_category_name IS NULL THEN 'unknown'
                ELSE coalesce(t.product_category_name_english, p.product_category_name) END AS category,
           sum(i.price)
    FROM raw.order_items i
    JOIN raw.orders o ON o.order_id = i.order_id
    LEFT JOIN raw.products p ON p.product_id = i.product_id
    LEFT JOIN raw.product_category_name_translation t
           ON t.product_category_name = p.product_category_name
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 10
  ordering: ordered
  allow_extra_columns: true
  expected_route: answer

