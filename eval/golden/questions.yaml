- id: trap_05
  split: dev
  category: trap
  question: How many order items are for products that have no category?
  reference_sql: |
    SELECT count(*) FROM raw.order_items i JOIN raw.products p ON p.product_id = i.product_id
    WHERE p.product_category_name IS NULL
  expected_route: answer
  tags: [missing_category]

- id: trap_06
  split: dev
  category: trap
  question: Which 5 sellers have the worst late-delivery rate?
  reference_sql: |
    WITH s AS (
      SELECT i.seller_id, o.order_id,
             o.order_delivered_customer_date::date > o.order_estimated_delivery_date::date AS late
      FROM raw.order_items i JOIN raw.orders o ON o.order_id = i.order_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
      GROUP BY 1, 2, 3)
    SELECT seller_id, round(100.0 * count(*) FILTER (WHERE late) / count(*), 2)
    FROM s GROUP BY 1 HAVING count(*) >= 30
    ORDER BY 2 DESC, 1 LIMIT 5
  ordering: ordered
  allow_extra_columns: true
  expected_route: answer
  tags: [minimum_volume, multi_seller]
  notes: Rankings need at least 30 orders (here delivered orders, the rate's denominator); without it, sellers with 1-3 orders at 100% dominate. Lateness of multi-seller orders is attributed to each seller in the order.

