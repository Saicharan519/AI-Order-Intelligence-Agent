- id: ambig_05
  split: dev
  category: ambiguous
  question: How are review scores trending?
  reference_sql: |
    WITH r AS (
      SELECT DISTINCT ON (order_id) order_id, review_score FROM raw.order_reviews
      ORDER BY order_id, review_answer_timestamp DESC, review_creation_date DESC, review_row_id DESC)
    SELECT date_trunc('month', o.order_purchase_timestamp)::date AS month,
           round(avg(r.review_score), 2)
    FROM raw.orders o JOIN r ON r.order_id = o.order_id
    WHERE o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-09-01'
    GROUP BY 1 ORDER BY 1
  ordering: ordered
  allow_extra_columns: true
  expected_route: [clarify, answer]
  tags: [duplicate_reviews]
  notes: Accepted - monthly average score over the analysis window (January 2017 to August 2018).

