# ============================== TRAP (14) ==============================
- id: trap_01
  split: test
  category: trap
  question: What was the 2017 revenue from orders paid at least partly by credit card?
  reference_sql: |
    SELECT sum(i.price)
    FROM raw.order_items i JOIN raw.orders o ON o.order_id = i.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
      AND EXISTS (SELECT 1 FROM raw.order_payments p
                  WHERE p.order_id = i.order_id AND p.payment_type = 'credit_card')
  expected_route: answer
  tags: [payment_fanout]
  notes: Joining items to payment rows double-counts orders with several card payments (4,905,129 instead of 4,859,393).

- id: trap_02
  split: dev
  category: trap
  question: How many unique customers placed orders in 2017?
  reference_sql: |
