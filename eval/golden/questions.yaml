- id: trend_04
  split: dev
  category: trend
  question: Compare revenue in the first quarter of 2018 with the first quarter of 2017.
  reference_sql: |
    SELECT extract(year FROM o.order_purchase_timestamp)::int AS year, sum(i.price)
    FROM raw.order_items i JOIN raw.orders o ON o.order_id = i.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND extract(month FROM o.order_purchase_timestamp) BETWEEN 1 AND 3
      AND extract(year FROM o.order_purchase_timestamp) IN (2017, 2018)
    GROUP BY 1
  accepted_alternatives:
    - |
      SELECT sum(i.price) FILTER (WHERE o.order_purchase_timestamp >= '2017-01-01'
                                    AND o.order_purchase_timestamp < '2017-04-01'),
             sum(i.price) FILTER (WHERE o.order_purchase_timestamp >= '2018-01-01'
                                    AND o.order_purchase_timestamp < '2018-04-01')
      FROM raw.order_items i JOIN raw.orders o ON o.order_id = i.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
  allow_extra_columns: true
  expected_route: answer
  notes: Two rows (one per year) or one row with two columns are both accepted; a growth column may be added.

