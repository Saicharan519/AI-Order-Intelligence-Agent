    WHERE o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
  expected_route: answer
  tags: [customers_vs_orders]

- id: trap_03
  split: dev
  category: trap
  question: How many delivered orders arrived late?
  reference_sql: |
    SELECT count(*) FROM raw.orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND order_delivered_customer_date::date > order_estimated_delivery_date::date
  expected_route: answer
  tags: [late_date_vs_timestamp]
  notes: Timestamp comparison gives 7,826 (same-day deliveries wrongly late); dates give 6,534.

- id: trap_04
  split: test
  category: trap
  question: What percentage of orders placed in February 2018 were delivered late?
  reference_sql: |
    SELECT round(100.0 * count(*) FILTER (
