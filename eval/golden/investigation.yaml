# ---------- negative controls (3): must say "nothing notable" ----------
- id: inv_neg_01
  question: Why were deliveries so bad in July 2017?
  playbook: late_delivery_diagnosis
  params: {period: "2017-07"}
  expected_verdict: nothing_notable
  notes: 2.8% late, below the baseline. The question's premise is false.
- id: inv_neg_02
  question: Investigate the late deliveries in June 2018.
  playbook: late_delivery_diagnosis
  params: {period: "2018-06"}
  expected_verdict: nothing_notable
  notes: 1.2% late, the lowest month.
- id: inv_neg_03
  question: What went wrong with deliveries in May 2017?
  playbook: late_delivery_diagnosis
  params: {period: "2017-05"}
  expected_verdict: nothing_notable
  notes: 3.0% late.

