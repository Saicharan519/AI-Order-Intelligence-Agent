# Investigation cases (technical design, section 8.6). DRAFT in M3; finalised in M7.
#
# Expected values are labelled from the data BEFORE the playbooks exist, so the playbook is
# checked against an independent expectation rather than against its own output.
# Labels marked "to label" are completed by independent analysis on raw tables before any
# narration is evaluated, and recorded with the query used.
#
# verdict: elevated | nothing_notable | not_applicable
# Late-rate figures below come from tests/integration/test_semantic_layer.py (PRD Example 2).

# ---------- late-delivery playbook: positive cases (6) ----------
- id: inv_late_01
  question: Why was March 2018 so bad for deliveries?
  playbook: late_delivery_diagnosis
  params: {period: "2018-03"}
  expected_verdict: elevated
  expected_top_driver: carrier_transit
  notes: 19.0% late vs about 5.8% baseline; PRD Example 3 says transit +3.9 days, handling flat.
- id: inv_late_02
  question: What went wrong with deliveries in February 2018?
  playbook: late_delivery_diagnosis
  params: {period: "2018-02"}
  expected_verdict: elevated
  expected_top_driver: to label
  notes: 14.1% late.
- id: inv_late_03
  question: Why were deliveries late in November 2017?
  playbook: late_delivery_diagnosis
  params: {period: "2017-11"}
  expected_verdict: elevated
  expected_top_driver: to label
  notes: 12.4% late; Black Friday volume (1,176 orders on 2017-11-24).
- id: inv_late_04
  question: Why were deliveries to Rio de Janeiro so late in March 2018?
  playbook: late_delivery_diagnosis
  params: {period: "2018-03", state: RJ}
  expected_verdict: elevated
  expected_top_driver: to label
  notes: PRD Example 3 - RJ 34.5% late (n=864) vs 10.5% baseline.
- id: inv_late_05
  question: Investigate late deliveries to Minas Gerais in March 2018.
  playbook: late_delivery_diagnosis
  params: {period: "2018-03", state: MG}
  expected_verdict: elevated
  expected_top_driver: to label
  notes: PRD Example 3 - MG 20.4% (n=856) vs 3.3% baseline.
- id: inv_late_06
  question: Why did late deliveries rise in December 2017?
  playbook: late_delivery_diagnosis
  params: {period: "2017-12"}
  expected_verdict: elevated
  expected_top_driver: to label
  notes: 7.5% late; borderline against the rule (baseline + 3 points and 1.5x baseline); the label is decided by computing the rule on raw tables.

