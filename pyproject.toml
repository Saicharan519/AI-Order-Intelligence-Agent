[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orderintel"
version = "0.1.0"
description = "Order Intelligence Agent: safe, evaluated natural-language analytics over the Olist dataset"
requires-python = ">=3.11"
# Dependencies are pinned in requirements*.txt; this file only makes src/ importable.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: needs the running PostgreSQL container",
    "paid: makes real LLM API calls (never run by default)",
    "realdata: checks figures of the real Olist data (skipped on the synthetic CI fixture)",
]
addopts = "-m 'not paid'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Tests build SQL strings on purpose to feed attacks and fixtures to the validator.
"tests/**" = ["S608", "E501"]  # long SQL and JSON fixtures are clearer on one line
# Playbook SQL is assembled from module constants only; user parameters are substituted into
# the syntax tree as typed literals and the result passes the validator (playbooks/base.py).
"src/orderintel/playbooks/**" = ["S608"]
# Evaluation scripts: reference SQL is assembled from module constants (no user input), and
# report rows are long Markdown table lines.
"eval/**" = ["S608", "E501"]
